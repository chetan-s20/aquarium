services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: aquarium
      POSTGRES_PASSWORD: aquarium
      POSTGRES_DB: aquarium
    ports:
      - "127.0.0.1:5432:5432" # host-only: the dev password must not face the network
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aquarium"]
      interval: 2s
      retries: 30
    restart: unless-stopped
  backend:
    build: . # full-stack image: API + built dashboard
    environment:
      DATABASE_URL: postgresql+psycopg://aquarium:aquarium@db:5432/aquarium
      SIMULATION_MODE: "true"
      DEVICE_API_KEY: ${DEVICE_API_KEY:-dev-device-key-change-me} # the MQTT bridge posts with this key
      DISEASE_URL: http://disease:8100 # photo checker; only up with --profile ml
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy # migrations run on start and need the DB up
    restart: unless-stopped
  mqtt:
    image: eclipse-mosquitto:2
    environment:
      MQTT_USER: ${MQTT_USER:-fishut}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-dev-mqtt-change-me}
    # mosquitto needs a password file; write it from the env on every start
    command: sh -c 'mosquitto_passwd -c -b /mosquitto/data/passwd "$$MQTT_USER" "$$MQTT_PASSWORD" && chown mosquitto:mosquitto /mosquitto/data/passwd && exec mosquitto -c /mosquitto/config/mosquitto.conf'
    volumes:
      - ./mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro,z
      - mqttdata:/mosquitto/data
    ports:
      - "1883:1883" # ESP32 gateways on the farm network publish here
    restart: unless-stopped
  mqtt-bridge:
    build: .
    command: python scripts/mqtt_bridge.py
    environment:
      MQTT_HOST: mqtt
      MQTT_USER: ${MQTT_USER:-fishut}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-dev-mqtt-change-me}
      API_URL: http://backend:8000
      DEVICE_API_KEY: ${DEVICE_API_KEY:-dev-device-key-change-me}
    depends_on:
      - mqtt
      - backend
    restart: unless-stopped
  disease:
    # Opt-in (docker compose --profile ml up): needs ml/models/disease_cnn.pt from ml/train_disease_cnn.py
    profiles: ["ml"]
    build: ./ml
    command: python ml/disease_service.py --host 0.0.0.0
    volumes:
      - ./ml:/work/ml:ro,z
    restart: unless-stopped
volumes:
  pgdata:
  mqttdata:
