# Application
APP_ENV=development
APP_NAME=aquarium-monitor
SECRET_KEY=change-me-in-production-use-a-long-random-string
API_HOST=0.0.0.0
API_PORT=8000
LOG_LEVEL=INFO

# Database (SQLite default for local dev; use PostgreSQL in production)
DATABASE_URL=sqlite:///./aquarium.db
# Example PostgreSQL URL (uncomment and set password):
# DATABASE_URL=postgresql+psycopg://aquarium:password@localhost:5432/aquarium

# Time
DEFAULT_TIMEZONE=UTC
# Display timezone for UI (IANA name)
DISPLAY_TIMEZONE=UTC

# Simulation / demo
SIMULATION_MODE=true
SIMULATOR_SEED=42
# Must be true to allow simulated readings to be stored; never label them as real
ALLOW_SIMULATED_DATA=true

# Security
ACCESS_TOKEN_EXPIRE_MINUTES=60
DEVICE_API_KEY_HEADER=X-Device-Key
RATE_LIMIT_PER_MINUTE=120

# Alerts (deferred channels)
ALERT_EMAIL_ENABLED=false
ALERT_WEBHOOK_ENABLED=false
